name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copiar la app como respaldo sin conexión
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Compilar el APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk TDT-Directo.apk
          gh release delete apk -y --cleanup-tag || true
          gh release create apk TDT-Directo.apk \
            --title "TDT Directo para Android" \
            --notes "APK para móviles y Android TV. Versión 1.0.${{ github.run_number }}. Descarga directa: https://github.com/${{ github.repository }}/releases/download/apk/TDT-Directo.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TDT-Directo-apk
          path: TDT-Directo.apk
