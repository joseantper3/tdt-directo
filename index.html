<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TDT Directo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
/* VOICE: un televisor de salón; sobrio, rótulos de emisión.
   IDEA: la pantalla del TV con su OSD de canal y la guía del mando.
   PICTURE: el directo a pantalla completa; banner de canal abajo.
   COLOUR and TYPE: negro azulado, blanco, rojo "directo"; Barlow Condensed para números.
   LAYOUT: vídeo a sangre, barra de mando abajo, guía y editor como capas. */
:root{color-scheme:dark;--bg:#07090e;--pan:#121722;--pan2:#1b2230;--ink:#f2f4f8;--mut:#9aa3b5;--acc:#ff4b3a;--ok:#3ad07a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{background:var(--pan2);border:1px solid #2b3446;border-radius:10px;min-height:44px;padding:0 16px;cursor:pointer}
button:hover{background:#252e40}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700}
#tv{position:fixed;inset:0;background:#000}
#tv video,#tv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
#msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#1a2233,#05070b 70%)}
#msg.on{display:grid}
#msg .lg{width:140px;height:140px;margin:0 auto 18px}
#msg p{color:var(--mut);max-width:420px;margin:8px auto 18px}
#msg a{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:10px;background:var(--acc);color:#fff;text-decoration:none;font-weight:600}
.lg{border-radius:14px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.lg img{width:100%;height:100%;object-fit:contain}
.lg b{font-family:"Barlow Condensed";font-size:1.4em;color:#fff}
#osd{position:absolute;left:max(4vw,12px);right:max(4vw,12px);bottom:92px;display:flex;gap:18px;align-items:center;padding:14px 20px;border-radius:16px;background:rgba(10,13,20,.86);backdrop-filter:blur(8px);transition:opacity .35s,transform .35s;opacity:0;transform:translateY(12px);pointer-events:none}
#osd.on{opacity:1;transform:none}
#osd .n{font-size:56px;line-height:1;min-width:70px}
#osd .lg{width:64px;height:64px}
#osd h2{margin:0;font-size:26px;line-height:1.1}
#osd small{color:var(--mut)}
.live{display:inline-flex;gap:6px;align-items:center;color:var(--acc);font-weight:600;font-size:14px}
.live::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc)}
#ext{position:absolute;top:14px;right:14px;z-index:2;display:none;padding:8px 14px;border-radius:10px;background:rgba(10,13,20,.86);color:#fff;text-decoration:none;font-size:14px}#ext.on{display:block}
#entry{position:absolute;top:24px;right:28px;font-size:64px;line-height:1;padding:6px 18px;border-radius:12px;background:rgba(10,13,20,.86);display:none}
#entry.on{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;padding:12px;background:linear-gradient(transparent,rgba(0,0,0,.85));transition:opacity .4s}
#bar.hide{opacity:0}
#bar .ch{font-size:22px;min-width:64px}
#state{position:absolute;top:16px;left:16px;font-size:13px;color:var(--mut);background:rgba(0,0,0,.6);padding:4px 10px;border-radius:8px}
.layer{position:fixed;inset:0;background:rgba(5,7,11,.96);display:none;flex-direction:column;z-index:5}
.layer.on{display:flex}
.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:16px max(4vw,14px);border-bottom:1px solid #222a39}
.head h1{margin:0 auto 0 0;font:700 32px/1.05 "Barlow Condensed"}
.scroll{overflow:auto;flex:1;padding:16px max(4vw,14px) 40px}
#guide .gbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
#prev{padding:16px 0 16px max(4vw,14px)}
.pv{position:relative;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden;border:1px solid #2b3446}
.pv video,.pv iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#pmsg{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;text-align:center;padding:12px;color:var(--mut);font-size:14px;background:radial-gradient(circle at 50% 40%,#1a2233,#05070b 75%)}
#pmsg.on{display:flex}#pmsg .lg{width:72px;height:72px}
.pinfo{display:flex;gap:10px;align-items:baseline;margin-top:12px}.pinfo .num{font-size:30px;color:var(--acc)}.pinfo b{font-size:22px}
@media(max-width:700px){#guide .gbody{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}#prev{padding:10px 14px 0}.pv{max-height:30vh;margin:auto}.pinfo{margin-top:6px}#pstate{margin:2px 0 0}}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px;border-radius:14px;background:var(--pan);border:2px solid transparent;min-height:auto;height:auto}
.card .lg{width:84px;height:84px}
.card .t{display:flex;gap:8px;align-items:baseline;width:100%;justify-content:center}
.card .t .num{font-size:24px;color:var(--acc)}
.card .t span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.cur{border-color:var(--acc)}
.card:focus{border-color:#fff;transform:scale(1.04)}
.card.nos{opacity:.7}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:600;font-size:14px;padding:6px}
td{padding:6px;border-top:1px solid #1f2635;vertical-align:middle}
td input[type=number]{width:76px}
input[type=text],input[type=url],input[type=number]{min-height:44px;font-size:16px;background:var(--pan);border:1px solid #2b3446;border-radius:8px;padding:0 10px;width:100%}
td .lg{width:40px;height:40px;border-radius:8px}
.ic{min-width:44px;padding:0 10px}
.tag{font-size:13px;color:var(--mut)}
#add{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0;padding:14px;border-radius:14px;background:var(--pan)}
#add h3{grid-column:1/-1;margin:0}
.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--pan2);padding:10px 18px;border-radius:10px;z-index:9;display:none}
#toast.on{display:block}
.help{color:var(--mut);font-size:14px;margin:0 0 14px}
@media(max-width:600px){#osd{bottom:140px;gap:12px}#osd .n{font-size:40px;min-width:48px}#osd h2{font-size:20px}
 .stack thead{display:none}.stack tr{display:grid;grid-template-columns:auto 1fr;gap:6px;padding:10px 0;border-top:1px solid #1f2635}.stack td{border:0;padding:2px}.stack td.w{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="tv">
  <video id="vid" playsinline autoplay controls></video>
  <div id="msg"><div><div class="lg" id="mlg"></div><h2 id="mtit" style="margin:0"></h2><p id="mtxt"></p><a id="mweb" target="_blank" rel="noopener">Ver en su web oficial · OK</a></div></div>
  <a id="ext" target="_blank" rel="noopener">Abrir fuera ↗</a>
  <div id="state">Cargando lista…</div>
  <div id="osd"><div class="n num" id="on"></div><div class="lg" id="olg"></div><div><h2 id="onm"></h2><span class="live">En directo</span> <small id="ofmt"></small></div></div>
  <div id="entry" class="num"></div>
</div>
<div id="bar">
  <button id="bPrev" class="ch num" aria-label="Canal anterior">CH −</button>
  <button id="bNext" class="ch num" aria-label="Canal siguiente">CH +</button>
  <button id="bGuide">Canales</button>
  <button id="bEdit">Editar numeración</button>
  <button id="bFull">Pantalla completa</button>
</div>

<section class="layer" id="guide" aria-label="Guía de canales">
  <div class="head"><h1>Canales</h1><button id="gEdit">Editar</button><button id="gClose">Cerrar</button></div>
  <div class="gbody">
    <aside id="prev" aria-label="Vista previa">
      <div class="pv"><video id="pvid" muted playsinline></video><div id="pmsg"><div class="lg" id="plg"></div><span id="ptxt"></span></div></div>
      <div class="pinfo"><span class="num" id="pnum"></span><b id="pname"></b></div>
      <p class="tag" id="pstate">Vista previa sin sonido · OK para verlo</p>
    </aside>
    <div class="scroll"><div id="grid"></div></div>
  </div>
</section>

<section class="layer" id="editor" aria-label="Editar canales">
  <div class="head"><h1>Editar numeración</h1>
    <button id="eRenum">Renumerar 1…N</button><button id="eRefresh">Actualizar enlaces</button>
    <button id="eExport">Exportar</button><button id="eImpB" type="button">Importar</button><input type="file" id="eImp" accept=".json,.m3u,.m3u8" hidden>
    <button id="eReset">Restaurar</button><button id="eClose" class="pri">Guardar y cerrar</button></div>
  <div class="scroll">
    <p class="help">Cambia el número de un canal y, si ya estaba ocupado, los dos se intercambian. Los cambios se guardan en este navegador.</p>
    <table class="stack"><thead><tr><th>Nº</th><th></th><th>Canal</th><th>Enlace</th><th>Visible</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <form id="add"><h3>Añadir canal</h3>
      <select id="aCat" aria-label="Del catálogo TDTChannels"><option value="">— Elegir del catálogo —</option></select>
      <input type="text" id="aName" placeholder="Nombre" required>
      <input type="url" id="aUrl" placeholder="Enlace .m3u8, YouTube o web">
      <input type="url" id="aLogo" placeholder="URL del logo (opcional)">
      <button class="pri">Añadir</button>
    </form>
  </div>
</section>
<div id="toast"></div>

 ["La 1 (Canarias)",["https://rtvelivestream.rtve.es/rtvesec/can/la1_can_main_dvr.m3u8"],'',"https://i.imgur.com/NbesiPn.png"],
 ["La 2 (Catalunya)",["https://rtvelivestream.rtve.es/rtvesec/cat/la2_cat_main_dvr.m3u8"],'',"https://i.imgur.com/DmuTwDw.png"],
 ["La 2 (Canarias)",["https://ztnr.rtve.es/ztnr/5468585.m3u8"],'',"https://i.imgur.com/DmuTwDw.png"],
 ["7TV Andalucía",["https://especial7tv.gestec-video.com/hls/regional.m3u8"],'',""]
];
const BV=3; // versión de la parrilla base: al subirla se añaden los canales nuevos a listas guardadas
const AMB=['Generalistas','Informativos','Deportivos','Infantiles','Andalucía'];
const norm=s=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const typeOf=u=>!u?'web':/youtu\.?be/.test(u)?'yt':/\.m3u8|\/hls|playlist|manifest/i.test(u)?'hls':'web';
let list=[], cat=[], cur=0, hls=null, osdT, barT, entry='', entryT, gFocus=0;

function save(){try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v)&&v.length)return v}catch(e){}return null}
function fresh(){return BASE.map((b,i)=>({id:'c'+i+Date.now().toString(36),num:i+1,name:b[0],url:b[1][0]||'',alts:b[1].slice(1),web:b[2],logo:b[3],hidden:false,custom:false}))}
// completa listas guardadas con logos y enlaces alternativos nuevos
function migrate(){let bv=0;try{bv=+localStorage.getItem('tdt.basev')||0}catch(e){}
  if(bv<BV&&load()){const have=new Set(list.map(c=>norm(c.name)));let n=Math.max(0,...list.map(c=>c.num));BASE.forEach((b,i)=>{if(!have.has(norm(b[0])))list.push({id:'b'+i+Date.now().toString(36),num:++n,name:b[0],url:'',alts:[],web:b[2],logo:'',hidden:false,custom:false})})}
  try{localStorage.setItem('tdt.basev',BV)}catch(e){}
  // quita enlaces caídos de Atresmedia: esos canales abren su directo de Atresplayer dentro de la app
  const DEAD=/a3live-lh\.akamaihd|livehlsdai-i\.akamaihd\.net\/hls\/live\/571640/;
  list.forEach(c=>{if(DEAD.test(c.url||'')){c.url=''}c.alts=(c.alts||[]).filter(u=>!DEAD.test(u));if(norm(c.name)==='telecinco'&&/mitele\.es/.test(c.web||''))c.web='https://www.mediasetinfinity.es/directo/telecinco/'});
  const m={};BASE.forEach(b=>m[norm(b[0])]=b);list.forEach(c=>{const b=m[norm(c.name)];c.alts=c.alts||[];if(!b)return;if(!c.logo&&b[3])c.logo=b[3];b[1].forEach(u=>{if(u!==c.url&&!c.alts.includes(u))c.alts.push(u)});if(!c.url&&!c.custom&&c.alts.length)c.url=c.alts.shift()})}
const vis=()=>list.filter(c=>!c.hidden).sort((a,b)=>a.num-b.num);
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}

function logo(c){
  const ini=c.name.split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase();
  let h=0;for(const ch of c.name)h=(h*31+ch.charCodeAt(0))%360;
  const fb=`<b style="background:hsl(${h} 55% 38%);width:100%;height:100%;display:grid;place-items:center">${ini}</b>`;
  return c.logo?`<img src="${c.logo}" alt="" loading="lazy" referrerpolicy="no-referrer" data-fb='${fb.replace(/'/g,'&#39;')}'>`:fb;
}
document.addEventListener('error',e=>{const t=e.target;if(t.tagName==='IMG'&&t.dataset.fb){t.outerHTML=t.dataset.fb}},true);

// ---- Reproducción ----
function stop(){$('ext').classList.remove('on');const v=$('vid');if(hls){hls.destroy();hls=null}v.pause();v.removeAttribute('src');v.load();const f=$('tv').querySelector('iframe');if(f)f.remove()}
function ytEmbed(u){let m=(u||'').match(/channel[=\/](UC[\w-]{22})/);if(m)return 'https://www.youtube.com/embed/live_stream?channel='+m[1]+'&autoplay=1';
  m=(u||'').match(/(?:v=|youtu\.be\/|embed\/|live\/)([\w-]{11})(?![\w-])/);return m?'https://www.youtube.com/embed/'+m[1]+'?autoplay=1':''}
// webs que no se dejan abrir dentro de otra página
const NOFRAME=['mitele.es','mediasetinfinity.es','dmax.es','ten.tv'];
function frameOK(u){try{const h=new URL(u).hostname;return !NOFRAME.some(d=>h===d||h.endsWith('.'+d))}catch(e){return false}}
function webFrame(c,u){$('vid').style.display='none';const f=document.createElement('iframe');f.src=u;f.allow='autoplay; fullscreen; encrypted-media; picture-in-picture';
  f.onload=()=>setTimeout(()=>window.focus(),500);$('tv').prepend(f);$('ext').href=u;$('ext').classList.add('on')}
function noStream(c,txt){const w0=c.web||(typeOf(c.url)==='web'?c.url:'');if(w0&&frameOK(w0)){webFrame(c,w0);return}
  $('mlg').innerHTML=logo(c);$('mtit').textContent=c.num+'  '+c.name;$('mtxt').textContent=txt;
  const w=c.web||(typeOf(c.url)==='web'?c.url:'');$('mweb').style.display=w?'':'none';if(w)$('mweb').href=w;$('msg').classList.add('on')}
function tune(c,k){
  if(!c)return; k=k||0; const srcs=[c.url,...(c.alts||[])].filter(u=>typeOf(u)==='hls'); stop(); $('msg').classList.remove('on'); const v=$('vid'); const t=typeOf(c.url);
  try{localStorage.setItem(LAST,c.id)}catch(e){}
  if(srcs.length&&t!=='yt'){
    v.style.display=''; const src=srcs[k];
    if(window.Hls&&Hls.isSupported()){hls=new Hls({maxBufferLength:20});hls.loadSource(src);hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));
      hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal){if(k+1<srcs.length){toast('Probando enlace alternativo '+(k+2)+'/'+srcs.length);tune(c,k+1);return}stop();noStream(c,'Ningún enlace funciona ahora mismo: la emisión está caída o el canal la bloquea fuera de su web.')}});}
    else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;v.onerror=()=>{if(k+1<srcs.length)tune(c,k+1);else noStream(c,'Ningún enlace funciona ahora mismo.')};v.play().catch(()=>{})}
    else noStream(c,'Este navegador no puede reproducir HLS.');
  }else if(t==='yt'&&ytEmbed(c.url)){v.style.display='none';const f=document.createElement('iframe');f.src=ytEmbed(c.url);f.allow='autoplay; fullscreen';$('tv').prepend(f)}
  else{v.style.display='none';noStream(c,'Esta web no permite verse dentro de la app. Pulsa OK en el mando para abrir su directo oficial.')}
  if(!k)osd(c);
}
function osd(c){$('on').textContent=c.num;$('olg').innerHTML=logo(c);$('onm').textContent=c.name;
  $('ofmt').textContent={hls:'· HLS',yt:'· YouTube',web:'· Web oficial'}[typeOf(c.url)];
  $('osd').classList.add('on');clearTimeout(osdT);osdT=setTimeout(()=>$('osd').classList.remove('on'),4000);showBar()}
function showBar(){$('bar').classList.remove('hide');clearTimeout(barT);barT=setTimeout(()=>$('bar').classList.add('hide'),5000)}
function go(i){const v=vis();if(!v.length)return;cur=(i+v.length)%v.length;tune(v[cur])}
const step=d=>go(cur+d);
function byNum(n){const v=vis();const i=v.findIndex(c=>c.num===n);if(i>=0)go(i);else toast('No hay canal '+n)}

// ---- Guía ----
function renderGrid(){const v=vis();$('grid').innerHTML=v.map((c,i)=>`<button class="card${i===cur?' cur':''}${typeOf(c.url)==='web'?' nos':''}" data-i="${i}"><div class="lg">${logo(c)}</div><div class="t"><span class="num">${c.num}</span><span>${c.name}</span></div></button>`).join('')}
function openGuide(){renderGrid();$('guide').classList.add('on');mainMuted=$('vid').muted;$('vid').muted=true;gFocus=cur;const b=$('grid').children[gFocus];if(b){b.focus();b.scrollIntoView({block:'center'})}}
const closeL=id=>$(id).classList.remove('on');
// ---- Vista previa en la guía ----
let phls=null,pT=null,pId='',mainMuted=false;
function stopPrev(){clearTimeout(pT);const v=$('pvid');if(phls){phls.destroy();phls=null}v.pause();v.removeAttribute('src');v.load();const f=$('prev').querySelector('iframe');if(f)f.remove();pId=''}
function pMsg(c,t){$('plg').innerHTML=logo(c);$('ptxt').textContent=t;$('pmsg').classList.add('on')}
function playPrev(c,k){k=k||0;const v=$('pvid');const srcs=[c.url,...(c.alts||[])].filter(u=>typeOf(u)==='hls');
  if(typeOf(c.url)==='yt'&&ytEmbed(c.url)){const f=document.createElement('iframe');f.src=ytEmbed(c.url)+'&mute=1';f.allow='autoplay';f.tabIndex=-1;$('prev').querySelector('.pv').prepend(f);return}
  if(!srcs.length){const w=c.web||(typeOf(c.url)==='web'?c.url:'');pMsg(c,w&&frameOK(w)?'Sin vista previa: OK abre su directo oficial en la app':'Sin vista previa: OK para abrir su web oficial');return}
  pMsg(c,'Cargando…');const src=srcs[k];
  const fail=()=>{if(k+1<srcs.length){stopPrev();pId=c.id;playPrev(c,k+1)}else{stopPrev();pId=c.id;pMsg(c,'La emisión no carga ahora mismo')}};
  if(window.Hls&&Hls.isSupported()){phls=new Hls({maxBufferLength:8});phls.loadSource(src);phls.attachMedia(v);
    phls.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(()=>{}));phls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)fail()})}
  else if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=src;v.onerror=fail;v.play().catch(()=>{})}
  v.onplaying=()=>$('pmsg').classList.remove('on')}
function preview(i){const c=vis()[i];if(!c||c.id===pId)return;stopPrev();pId=c.id;$('pmsg').classList.remove('on');
  $('pnum').textContent=c.num;$('pname').textContent=c.name;pMsg(c,'');$('ptxt').textContent='';pT=setTimeout(()=>playPrev(c),450)}
$('grid').addEventListener('focusin',e=>{const b=e.target.closest('.card');if(b){gFocus=+b.dataset.i;preview(gFocus)}});
$('grid').addEventListener('mouseover',e=>{const b=e.target.closest('.card');if(b)preview(+b.dataset.i)});
function closeGuide(){stopPrev();closeL('guide');$('vid').muted=mainMuted}
$('grid').addEventListener('click',e=>{const b=e.target.closest('.card');if(b){closeGuide();go(+b.dataset.i)}});
function gridMove(k){const cards=[...$('grid').children];if(!cards.length)return;
  const cols=Math.max(1,Math.round($('grid').clientWidth/cards[0].offsetWidth));
  const d={ArrowRight:1,ArrowLeft:-1,ArrowDown:cols,ArrowUp:-cols}[k];gFocus=Math.min(cards.length-1,Math.max(0,gFocus+d));cards[gFocus].focus();cards[gFocus].scrollIntoView({block:'nearest'})}

// ---- Editor ----
function renderRows(){const s=[...list].sort((a,b)=>a.num-b.num);
  $('rows').innerHTML=s.map(c=>`<tr data-id="${c.id}">
   <td><input type="number" min="1" value="${c.num}" class="num" data-f="num" aria-label="Número"></td>
   <td><div class="lg">${logo(c)}</div></td>
   <td class="w"><input type="text" value="${c.name.replace(/"/g,'&quot;')}" data-f="name" aria-label="Nombre"></td>
   <td class="w"><input type="url" value="${(c.url||'').replace(/"/g,'&quot;')}" data-f="url" placeholder="Sin enlace directo · se abre la web" aria-label="Enlace"></td>
   <td><label class="tag"><input type="checkbox" data-f="hidden" ${c.hidden?'':'checked'}> Visible</label></td>
   <td><button class="ic" data-a="up" aria-label="Subir">▲</button> <button class="ic" data-a="down" aria-label="Bajar">▼</button> <button class="ic" data-a="del" aria-label="Borrar">✕</button></td></tr>`).join('')}
function setNum(c,n){if(!(n>=1))return;const o=list.find(x=>x!==c&&x.num===n);if(o)o.num=c.num;c.num=n}
$('rows').addEventListener('change',e=>{const tr=e.target.closest('tr'),c=list.find(x=>x.id===tr.dataset.id),f=e.target.dataset.f;if(!c)return;
  if(f==='num')setNum(c,parseInt(e.target.value,10));else if(f==='hidden')c.hidden=!e.target.checked;
  else if(f==='url'){c.url=e.target.value.trim();c.custom=true}else c[f]=e.target.value.trim();save();renderRows()});
$('rows').addEventListener('click',e=>{const a=e.target.dataset.a;if(!a)return;const c=list.find(x=>x.id===e.target.closest('tr').dataset.id);
  const s=[...list].sort((x,y)=>x.num-y.num),i=s.indexOf(c);
  if(a==='del'){list=list.filter(x=>x!==c)}else{const o=s[i+(a==='up'?-1:1)];if(o){const t=o.num;o.num=c.num;c.num=t}}save();renderRows()});
$('eRenum').onclick=()=>{[...list].sort((a,b)=>a.num-b.num).forEach((c,i)=>c.num=i+1);save();renderRows();toast('Numeración 1…'+list.length)};
$('eReset').onclick=()=>{list=fresh();applyCat(true);save();renderRows();toast('Lista restaurada')};
$('eRefresh').onclick=()=>fetchCat(true);
$('eExport').onclick=()=>{const b=new Blob([JSON.stringify(list,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='canales-tdt.json';a.click()};
$('eImpB').onclick=()=>$('eImp').click();
$('eImp').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();
  try{if(/^\s*\[/.test(t)){list=JSON.parse(t)}else{const out=[];let m=null;t.split(/\r?\n/).forEach(l=>{if(l.startsWith('#EXTINF')){m={name:(l.split(',').pop()||'Canal').trim(),logo:(l.match(/tvg-logo="([^"]*)"/)||[])[1]||''}}else if(m&&l.trim()&&!l.startsWith('#')){out.push({...m,url:l.trim()});m=null}});
    list=out.map((c,i)=>({id:'m'+i+Date.now().toString(36),num:i+1,name:c.name,url:c.url,logo:c.logo,web:'',hidden:false,custom:true}))}
    save();renderRows();toast(list.length+' canales importados')}catch(err){toast('Archivo no válido')}};
$('add').onsubmit=e=>{e.preventDefault();const n=Math.max(0,...list.map(c=>c.num))+1;
  list.push({id:'u'+Date.now().toString(36),num:n,name:$('aName').value.trim(),url:$('aUrl').value.trim(),logo:$('aLogo').value.trim(),web:'',hidden:false,custom:true});
  e.target.reset();save();renderRows();toast('Añadido en el '+n)};
$('aCat').onchange=e=>{const c=cat[e.target.value];if(!c)return;$('aName').value=c.name;$('aUrl').value=c.url||c.web||'';$('aLogo').value=c.logo||''};
function openEditor(){if($('guide').classList.contains('on'))closeGuide();renderRows();$('editor').classList.add('on')}
$('eClose').onclick=()=>{closeL('editor');const id=(vis()[cur]||{}).id;save();cur=Math.max(0,vis().findIndex(c=>c.id===id));showBar()};

// ---- Catálogo en vivo (TDTChannels) ----
function applyCat(addNew){if(!cat.length)return;const idx={};cat.forEach(c=>idx[norm(c.name)]=c);
  list.forEach(c=>{const m=idx[norm(c.name)];if(!m)return;if(!c.logo&&m.logo)c.logo=m.logo;if(m.web)c.web=m.web;c.alts=c.alts||[];
    if(!c.custom&&m.url&&m.url!==c.url&&typeOf(m.url)!=='web'){if(c.url&&!c.alts.includes(c.url))c.alts.unshift(c.url);c.alts=c.alts.filter(u=>u!==m.url);c.url=m.url}});
  if(addNew){const have=new Set(list.map(c=>norm(c.name)));let n=Math.max(0,...list.map(c=>c.num));
    cat.filter(c=>AMB.includes(c.ambit)&&typeOf(c.url)==='hls'&&!have.has(norm(c.name))).forEach(c=>{have.add(norm(c.name));list.push({id:'t'+(++n)+Date.now().toString(36),num:n,name:c.name,url:c.url,logo:c.logo,web:c.web,hidden:false,custom:false})})}
  $('aCat').innerHTML='<option value="">— Elegir del catálogo —</option>'+cat.map((c,i)=>`<option value="${i}">${c.ambit} · ${c.name}</option>`).join('')}
async function fetchCat(manual){$('state').style.display='';$('state').textContent='Actualizando enlaces…';
  try{const r=await fetch(SRC,{cache:'no-store'});const j=await r.json();cat=[];
    (j.countries||[]).forEach(co=>(co.ambits||[]).forEach(a=>(a.channels||[]).forEach(ch=>{const o=ch.options||[];
      const op=o.find(x=>x.format==='m3u8')||o.find(x=>x.format==='youtube');cat.push({name:ch.name,logo:ch.logo||'',web:ch.web||'',url:op?op.url:'',ambit:a.name})})));
    const first=!load();applyCat(first);save();$('state').textContent='Lista actualizada · '+vis().length+' canales';
    if(manual){renderRows();toast('Enlaces actualizados')}}
  catch(e){$('state').textContent='Sin conexión con la lista en línea · usando la guardada';if(manual)toast('No se pudo descargar la lista')}
  setTimeout(()=>$('state').style.display='none',3500)}

// ---- Mando / teclado ----
function digit(d){entry=(entry+d).slice(0,3);$('entry').textContent=entry;$('entry').classList.add('on');clearTimeout(entryT);
  entryT=setTimeout(()=>{byNum(parseInt(entry,10));entry='';$('entry').classList.remove('on')},1500)}
document.addEventListener('keydown',e=>{
  const k=e.key,c=e.keyCode,inInput=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  const back=k==='Escape'||k==='GoBack'||k==='BrowserBack'||c===461||c===10009||(k==='Backspace'&&!inInput);
  if($('editor').classList.contains('on')){if(back&&!inInput){e.preventDefault();$('eClose').click()}return}
  if($('guide').classList.contains('on')){
    if(back){e.preventDefault();closeGuide()}else if(/^Arrow/.test(k)){e.preventDefault();gridMove(k)}
    else if(k==='ChannelUp'||c===427||c===33){e.preventDefault();gridMove('ArrowDown')}else if(k==='ChannelDown'||c===428||c===34){e.preventDefault();gridMove('ArrowUp')}
    return}
  const dg=(c>=48&&c<=57)?c-48:(c>=96&&c<=105)?c-96:null;
  if(dg!==null&&!inInput){e.preventDefault();digit(String(dg));return}
  if(k==='ArrowUp'||k==='ChannelUp'||k==='MediaTrackNext'||c===427||c===33){e.preventDefault();step(1)}
  else if(k==='ArrowDown'||k==='ChannelDown'||k==='MediaTrackPrevious'||c===428||c===34){e.preventDefault();step(-1)}
  else if(k==='Enter'&&!entry&&$('msg').classList.contains('on')&&$('mweb').style.display!=='none'){e.preventDefault();$('mweb').click()}
  else if(k==='Enter'||k==='ContextMenu'||k==='g'||k==='G'||c===457){e.preventDefault();if(entry){clearTimeout(entryT);byNum(parseInt(entry,10));entry='';$('entry').classList.remove('on')}else openGuide()}
  else if(k==='i'||k==='Info'){const v=vis()[cur];if(v)osd(v)}
  else if(k==='e'||k==='E'){openEditor()}
  else if(k==='m'||k==='M'||k==='AudioVolumeMute'){$('vid').muted=!$('vid').muted}
  else if(k==='f'||k==='F'){$('bFull').click()}
  else showBar();
});
// gestos táctiles: deslizar arriba/abajo cambia de canal
let ty=null;$('tv').addEventListener('touchstart',e=>{ty=e.touches[0].clientY},{passive:true});
$('tv').addEventListener('touchend',e=>{if(ty===null)return;const d=e.changedTouches[0].clientY-ty;ty=null;if(Math.abs(d)>70)step(d<0?1:-1);else showBar()});
$('tv').addEventListener('mousemove',showBar);
$('bPrev').onclick=()=>step(-1);$('bNext').onclick=()=>step(1);
$('bGuide').onclick=openGuide;$('gClose').onclick=closeGuide;$('bEdit').onclick=openEditor;$('gEdit').onclick=openEditor;
$('bFull').onclick=()=>{const d=document;(d.fullscreenElement?d.exitFullscreen():d.documentElement.requestFullscreen()).catch(()=>{})};

// ---- Inicio ----
list=load()||fresh();migrate();save();
let last='';try{last=localStorage.getItem(LAST)||''}catch(e){}
cur=Math.max(0,vis().findIndex(c=>c.id===last));
tune(vis()[cur]);
fetchCat(false).then(()=>{const v=vis()[cur];if(v&&typeOf(v.url)==='hls'&&!hls&&!$('vid').src)tune(v)});
}
</script>
